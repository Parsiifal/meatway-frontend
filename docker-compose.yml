version: "3.8"

services:
  frontend:
    build: .
    container_name: meatway-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=meatway-bucket
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - meatway-net
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: meatway-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - meatway-net
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        until mc alias set minio http://minio:9000 minioadmin minioadmin; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        mc mb minio/meatway-bucket --ignore-existing;
        mc anonymous set public minio/meatway-bucket;
        echo 'MinIO bucket initialized';
      "
    networks:
      - meatway-net

volumes:
  minio_data:
    name: meatway-minio-data

networks:
  meatway-net:
    name: meatway-network
